name: Build Android APK + release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag/verze releasu (default: app-v<verze z package.json>)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: songcraft-studio-android-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Compute release tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.release_tag }}" ]; then
            echo "tag=${{ github.event.inputs.release_tag }}"
          else
            V="$(node -p "require('./package.json').version")"
            echo "tag=app-v${V}"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: SongCraft Studio ${{ steps.tag.outputs.tag }}
          body: |
            SongCraft Studio – Android APK.
            Sestaveno GitHub Actions (expo prebuild + gradle assembleRelease).
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true